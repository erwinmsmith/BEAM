site_name: BEAM
site_description: Bayesian energy-aware communication for LLM multi-agent systems.
site_url: https://erwinmsmith.github.io/BEAM/
repo_url: https://github.com/erwinmsmith/BEAM
repo_name: erwinmsmith/BEAM
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
plugins:
  - search
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/erwinmsmith/BEAM
nav:
  - Overview: index.md
  - Start:
      - Architecture: getting-started/overview.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Configuration: getting-started/config.md
  - Algorithms:
      - Probability model: models/beam-theory.md
      - Implementation reference: models/implementation.md
      - Strategy interfaces: models/strategies.md
  - Build:
      - API reference: api-reference/apireference.md
      - Offline example: examples/basic-examples.md
      - Execution example: examples/examples.md
      - Prompt templates: examples/prompts-examples.md
      - LangChain: models/LangChain.md
      - LangGraph: models/LangGraph.md
  - Project:
      - Engineering: advanced.md
      - FAQ: faq.md
      - Changelog: changelog.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
